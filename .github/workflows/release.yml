# Builds and publishes a release when a version tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
# Everything is built here, on GitHub's servers, from the public source code.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance
  attestations: write   # publish the build provenance

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./build.ps1 -Version $env:TAG.Substring(1) -RepoUrl $env:REPO_URL -RequireInstaller

      # Signed statement that these files were built by this workflow from this commit.
      # Anyone can check it with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:TAG.Substring(1)
          $setup = "PhotoStudio-$version-win-x64-setup.exe"
          $notes = @"
          ## Download

          | File | |
          |---|---|
          | **$setup** | Installer (recommended) |
          | PhotoStudio-$version-win-x64-portable.zip | Portable: unzip and run ``PhotoStudio.exe`` |

          Windows 10/11 64-bit. Nothing else to install.

          ## Verify your download

          These files were built by GitHub Actions from the source code of this tag
          ([workflow run]($env:GITHUB_SERVER_URL/$env:REPO/actions/runs/$env:GITHUB_RUN_ID)).

          - **Checksum**: ``Get-FileHash $setup`` must match the line in ``SHA256SUMS.txt``.
          - **Build provenance**: ``gh attestation verify $setup --repo $env:REPO``

          "@
          $files = (Get-ChildItem artifacts -File).FullName
          $pre = if ($version.Contains('-')) { '--prerelease' } else { '--latest' }
          # A release made by hand on the website for this tag is filled in instead of failing.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:TAG --title "PhotoStudio $version" --notes $notes $pre
          } else {
            gh release create $env:TAG @files --title "PhotoStudio $version" --notes $notes --generate-notes --verify-tag $pre
          }
